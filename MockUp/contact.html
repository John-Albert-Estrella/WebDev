<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trifold Quezon Tours - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">
                <h1>Trifold</h1>
                <span>Quezon Tours</span>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="destinations.html">Destinations</a></li>
                    <li><a href="packages.html">Packages</a></li>
                    <li><a href="contact.html" class="active">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h2 class="section-title">Book Your Tour</h2>
            <p class="section-subtext">Send an inquiry for tour schedules, boat rentals, or custom trip arrangements.</p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Juan Dela Cruz">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="juan@example.com">
                </div>

                <div class="form-group">
                    <label for="package">Select Quezon Package</label>
                    <select id="package" name="package">
                        <option value="heritage">Heritage & Food Tour (₱2,500)</option>
                        <option value="padre-burgos">Padre Burgos Island Hopping (₱4,500)</option>
                        <option value="cagbalete">Cagbalete & Jomalig Escape (₱7,800)</option>
                        <option value="custom">Custom Tour Inquiry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message / Special Requests</label>
                    <textarea id="message" name="message" rows="4" placeholder="Mention travel dates, group size, or pickup points..."></textarea>
                </div>

                <button type="submit">Submit Inquiry</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Trifold Quezon Tours. All rights reserved.</p>
    </footer>

</body>
</html>
